name: 大肌肌 Android source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Fork behaviour and media checks
        working-directory: frontend
        run: >-
          npx vitest run
          scripts/fork-release.test.mjs
          scripts/app-icons.test.mjs
          src/lib/nfc-tags.test.js
          src/lib/widget-links.test.js
          src/lib/update.test.js
          src/lib/mobile.autobackup.test.js
          src/lib/mobile.backupfolder.test.js
          src/lib/plan-print.test.js
          src/views/Settings.update.test.jsx
      - name: Build Android assets without restricted exercise media
        run: npm run build:mobile
        working-directory: frontend
      - name: Android unit tests and debug APK
        run: ./gradlew --no-daemon testSideloadDebugUnitTest assembleSideloadDebug
        working-directory: frontend/android
