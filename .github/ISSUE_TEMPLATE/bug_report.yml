name: Bug report
description: 大肌肌 Android 应用或本改版源码出现故障
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What did you do?
      description: Steps to reproduce, as precisely as you can.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages, console output, or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running 大肌肌?
      description: Pick all that apply.
      multiple: true
      options:
        - Android APK from this repository, local use
        - Android APK from this repository, connected to my server
        - Self-hosted server or browser frontend from this repository
        - Frontend dev server (npm run dev)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 大肌肌 version
      description: See Settings → About; include the source commit if you built it yourself.
      placeholder: e.g. 0.1.0, commit abc1234
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Device, OS & browser
      placeholder: e.g. Pixel 8 on Android 16, Chrome 141 on Windows
    validations:
      required: true

  - type: checkboxes
    id: passkey
    attributes:
      label: Is this about login / passkeys?
      description: >
        Most login issues are an `RP_ID`/`ORIGIN` mismatch — check your `.env` against the
        domain you're accessing the self-hosted server from before reporting. See the
        [self-hosting guide](../../docs/SELF_HOSTING.md).
      options:
        - label: Yes, this is a login/passkey issue and I've already checked RP_ID/ORIGIN
